name: DeFi Recipes CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-contracts:
    name: Foundry Smart Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Run Forge Tests
        run: |
          cd contracts
          forge test -vvv

  test-keeper:
    name: Keeper Build and Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Install Keeper Dependencies
        run: |
          cd keeper
          pnpm install --frozen-lockfile

      - name: Build Keeper
        run: |
          cd keeper
          pnpm run build

      - name: Test Keeper
        run: |
          cd keeper
          pnpm test

  test-web:
    name: Web Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Install Web Dependencies
        run: |
          cd web
          pnpm install --frozen-lockfile

      - name: Build Web
        run: |
          cd web
          pnpm run build

  ci-gate:
    name: Monorepo Merge Gate
    runs-on: ubuntu-latest
    needs:
      - test-contracts
      - test-keeper
      - test-web
    # Always run so PRs are blocked even when an upstream job is skipped or cancelled.
    if: always()
    steps:
      - name: Evaluate upstream jobs
        run: |
          echo "contracts=${{ needs.test-contracts.result }}"
          echo "keeper=${{ needs.test-keeper.result }}"
          echo "web=${{ needs.test-web.result }}"
          # Treat anything other than 'success' as a gate failure (covers failure, skipped, cancelled).
          if [ "${{ needs.test-contracts.result }}" != "success" ] \
            || [ "${{ needs.test-keeper.result }}" != "success" ] \
            || [ "${{ needs.test-web.result }}" != "success" ]; then
            echo "One or more required checks did not succeed (result must be 'success')."
            exit 1
          fi
          echo "All required checks passed."
